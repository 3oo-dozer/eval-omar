spring.application.name=EvaluationTechnique

# SQLite
spring.datasource.url=jdbc:sqlite:sqlite/sqlite.test.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Serveur
server.port=8080
# Ne jamais renvoyer de stacktrace / message d'exception au client
server.error.include-stacktrace=never
server.error.include-message=never

# JWT Configuration
# En production, fournir le secret via la variable d'environnement JWT_SECRET (>= 32 octets).
# La valeur par défaut ne sert qu'au développement local.
jwt.secret=${JWT_SECRET:AZERTYUIOP0123456789AZERTYUIOP0123456789AZERTYUIOP0123456789}
# Durée de validité du jeton en ms (1 h)
jwt.expiration=${JWT_EXPIRATION:3600000}
